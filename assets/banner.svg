<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06121E" />
      <stop offset="50%" stop-color="#0A2229" />
      <stop offset="100%" stop-color="#041814" />
    </linearGradient>

    <radialGradient id="glowPulse1" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glowPulse2" cx="80%" cy="70%" r="60%">
      <stop offset="0%" stop-color="#06D6A0" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#06D6A0" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glowPulse3" cx="60%" cy="20%" r="40%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0" />
    </radialGradient>

    <!-- Card and Pill Linear Gradients -->
    <linearGradient id="pillGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#06D6A0" stop-opacity="0.05" />
    </linearGradient>

    <linearGradient id="pillGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.05" />
    </linearGradient>

    <linearGradient id="pillGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#D97706" stop-opacity="0.05" />
    </linearGradient>

    <!-- Title Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#E2FBE8" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>

    <!-- Filter for subtle shadow -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <filter id="textShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.7" />
    </filter>

    <style>
      /* Dynamic Keyframe Animations */
      @keyframes floatSlow1 {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-8px) rotate(1deg); }
      }
      @keyframes floatSlow2 {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(7px) rotate(-1deg); }
      }
      @keyframes floatSlow3 {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-6px); }
      }
      @keyframes pulseAura {
        0%, 100% { opacity: 0.7; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.06); }
      }
      @keyframes flowDash {
        to { stroke-dashoffset: -80; }
      }
      @keyframes nodeGlow {
        0%, 100% { r: 5; opacity: 0.8; }
        50% { r: 7.5; opacity: 1; }
      }

      .floating-pill-1 {
        animation: floatSlow1 6s ease-in-out infinite;
      }
      .floating-pill-2 {
        animation: floatSlow2 7s ease-in-out infinite;
      }
      .floating-pill-3 {
        animation: floatSlow3 5.5s ease-in-out infinite;
      }
      .pulse-bg {
        animation: pulseAura 8s ease-in-out infinite;
        transform-origin: center;
      }
      .dash-path {
        stroke-dasharray: 8, 8;
        animation: flowDash 3s linear infinite;
      }
      .glowing-node {
        animation: nodeGlow 2.5s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGradient)" />

  <!-- Animated Ambient Glows (strictly background layer) -->
  <g class="pulse-bg">
    <circle cx="240" cy="100" r="280" fill="url(#glowPulse1)" />
    <circle cx="980" cy="260" r="320" fill="url(#glowPulse2)" />
    <circle cx="700" cy="80" r="220" fill="url(#glowPulse3)" />
  </g>

  <!-- Subtle Eco Grid Lines -->
  <g opacity="0.08" stroke="#10B981" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="200" y1="0" x2="200" y2="360" />
    <line x1="400" y1="0" x2="400" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="800" y1="0" x2="800" y2="360" />
    <line x1="1000" y1="0" x2="1000" y2="360" />
  </g>

  <!-- Background Animated Data Stream / Network Nodes (placed away from center text) -->
  <g opacity="0.45">
    <path d="M 840,310 C 920,280 960,200 1040,180 S 1120,120 1180,90" fill="none" stroke="#10B981" stroke-width="2" class="dash-path" />
    <path d="M 780,340 C 860,320 940,310 1010,240 S 1110,200 1170,170" fill="none" stroke="#38BDF8" stroke-width="1.5" class="dash-path" />
    <circle cx="1040" cy="180" r="5" fill="#10B981" class="glowing-node" />
    <circle cx="940" cy="220" r="4" fill="#38BDF8" class="glowing-node" />
    <circle cx="1120" cy="120" r="5" fill="#34D399" class="glowing-node" />
  </g>

  <!-- Peripheral Floating Indicator Badges (kept safely away from title/subtitle) -->
  <!-- Top Right Indicator 1: Scope 1, 2, 3 -->
  <g class="floating-pill-1" transform="translate(860, 42)">
    <rect width="180" height="38" rx="19" fill="#0C2522" stroke="#10B981" stroke-width="1.2" opacity="0.9" />
    <circle cx="22" cy="19" r="6" fill="#10B981" />
    <text x="36" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#E2FBE8">Scope 1 • 2 • 3 GHG</text>
  </g>

  <!-- Top Right Indicator 2: CSRD & ESRS -->
  <g class="floating-pill-2" transform="translate(1055, 42)">
    <rect width="115" height="38" rx="19" fill="#0B202D" stroke="#38BDF8" stroke-width="1.2" opacity="0.9" />
    <circle cx="20" cy="19" r="6" fill="#38BDF8" />
    <text x="34" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#E0F2FE">CSRD / ESRS</text>
  </g>

  <!-- Bottom Right Indicator 3: Net Zero & LCA -->
  <g class="floating-pill-3" transform="translate(930, 296)">
    <rect width="210" height="36" rx="18" fill="#1A271F" stroke="#34D399" stroke-width="1.2" opacity="0.9" />
    <circle cx="20" cy="18" r="5" fill="#34D399" />
    <text x="34" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#D1FAE5">Net-Zero • PCAF • LCA</text>
  </g>

  <!-- FOREGROUND CONTENT: Guaranteed prominent and 100% unobscured -->
  <g transform="translate(80, 0)">
    <!-- Top Pill Category Header -->
    <g transform="translate(0, 58)">
      <rect width="320" height="32" rx="16" fill="url(#pillGrad1)" stroke="#10B981" stroke-width="1" />
      <text x="18" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#34D399" letter-spacing="0.6">
        🌱 CLIMATE TECH &amp; ESG DIRECTORY
      </text>
    </g>

    <!-- Main Title: Crisp, bold, clear foreground -->
    <text x="0" y="152" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" fill="url(#titleGrad)" filter="url(#textShadow)" letter-spacing="-0.5">
      Awesome ESG &amp; Carbon Accounting
    </text>

    <!-- Secondary Heading / Focus -->
    <text x="0" y="200" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#A7F3D0" filter="url(#textShadow)" letter-spacing="-0.2">
      Software &amp; Open-Source Ecosystem
    </text>

    <!-- Subtitle: Explanatory paragraph line -->
    <text x="0" y="246" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#94A3B8" letter-spacing="0.1">
      Curated platforms, calculation engines, and open repositories for greenhouse gas emissions tracking,
    </text>
    <text x="0" y="272" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#94A3B8" letter-spacing="0.1">
      CSRD/ESRS regulatory compliance, product LCA, and corporate decarbonization.
    </text>

    <!-- Badges in the Banner footer -->
    <g transform="translate(0, 304)">
      <g transform="translate(0, 0)">
        <rect width="136" height="26" rx="6" fill="#132E27" stroke="#059669" stroke-width="0.8" />
        <text x="12" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#6EE7B7">🏢 Enterprise SaaS</text>
      </g>
      <g transform="translate(146, 0)">
        <rect width="154" height="26" rx="6" fill="#0C2538" stroke="#0284C7" stroke-width="0.8" />
        <text x="12" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#7DD3FC">💻 Open-Source Repos</text>
      </g>
      <g transform="translate(310, 0)">
        <rect width="152" height="26" rx="6" fill="#2E2412" stroke="#D97706" stroke-width="0.8" />
        <text x="12" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#FCD34D">⚖️ Audit &amp; Compliance</text>
      </g>
    </g>
  </g>

  <!-- Subtle Border Ring around Entire Banner -->
  <rect width="1200" height="360" rx="16" fill="none" stroke="#10B981" stroke-width="1" opacity="0.3" />
</svg>
